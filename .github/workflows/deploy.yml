name: Build and Deploy to Minikube

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  K8S_DEPLOYMENT_NAME: ${{ secrets.K8S_DEPLOYMENT_NAME }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  SERVICE_NAME: devops-app-service
  NODE_PORT: "30080"
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2 (Minikube)
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          K8S_DEPLOYMENT_NAME: ${{ secrets.K8S_DEPLOYMENT_NAME }}
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
          SERVICE_NAME: devops-app-service
          NODE_PORT: "30080"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,K8S_DEPLOYMENT_NAME,K8S_NAMESPACE,SERVICE_NAME,NODE_PORT
          script: |
            set -e
            command -v aws >/dev/null
            command -v kubectl >/dev/null
            kubectl -n $K8S_NAMESPACE delete secret ecr-secret --ignore-not-found
            kubectl -n $K8S_NAMESPACE create secret docker-registry ecr-secret \
              --docker-server=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com \
              --docker-username=AWS \
              --docker-password=$(aws ecr get-login-password --region $AWS_REGION)
            kubectl -n $K8S_NAMESPACE rollout restart deployment/$K8S_DEPLOYMENT_NAME
            kubectl -n $K8S_NAMESPACE rollout status deployment/$K8S_DEPLOYMENT_NAME
            pkill -f "kubectl port-forward --address 0.0.0.0 service/$SERVICE_NAME $NODE_PORT:80" || true
            nohup kubectl port-forward --address 0.0.0.0 service/$SERVICE_NAME $NODE_PORT:80 >/tmp/port-forward.log 2>&1 &
            kubectl -n $K8S_NAMESPACE get pods -o wide
            kubectl -n $K8S_NAMESPACE get services
